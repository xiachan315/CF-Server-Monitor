name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'LICENSE'
  # 上游同步（sync.yml）是用 secrets.GITHUB_TOKEN 推送的，GitHub 规定
  # 这类 push 不会触发其它 workflow。因此这里显式挂到同步完成事件上，
  # 保证「每日同步 → 自动部署」这条链是通的。
  workflow_run:
    workflows: ["Upstream Sync"]
    types:
      - completed
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.decide.outputs.should_deploy }}
    steps:
      - id: decide
        run: |
          if [ -n "$CF_ACCOUNT_ID" ] || [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "should_deploy=true" >> $GITHUB_OUTPUT
          else
            echo "should_deploy=false" >> $GITHUB_OUTPUT
          fi
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          EVENT_NAME: ${{ github.event_name }}

  deploy:
    needs: check
    if: needs.check.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          ref: main

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 📦 Install dependencies
        run: npm install

      - name: 🏗️ Build frontend assets
        run: npm run build:frontend

      # 配置的唯一来源是仓库根目录的 wrangler.toml（上游维护，随每日同步自动更新）。
      # 这样上游新增绑定 / 定时任务 / 兼容性设置会被自动继承；
      # 本文件只负责注入 CI 专属的两项：D1 库 ID、面板登录口令。
      - name: 📝 准备 wrangler.toml
        env:
          D1_ID: ${{ secrets.D1_DATABASE_ID }}
          PANEL_SECRET: ${{ secrets.API_SECRET }}
        run: |
          [ -f wrangler.toml ] || { echo "❌ 仓库根目录没有 wrangler.toml"; exit 1; }
          [ -n "${D1_ID:-}" ] || { echo "❌ 缺少 repo secret: D1_DATABASE_ID"; exit 1; }
          [ -n "${PANEL_SECRET:-}" ] || { echo "❌ 缺少 repo secret: API_SECRET"; exit 1; }

          # 1) worker 名对齐线上（l-l.eu.cc 的路由绑在这个 worker 上）
          #    只改第一处 name =，避免误伤 [[durable_objects.bindings]] 里的 name
          sed -i '0,/^name *=/s|^name *=.*|name = "cf-server-monitor"|' wrangler.toml

          # 2) 补 keep_vars = true（缺了会把线上已有的其它变量清掉）
          if ! grep -q '^keep_vars *= *true' wrangler.toml; then
            sed -i '0,/^compatibility_flags *=/s|^\(compatibility_flags *=.*\)$|\1\nkeep_vars = true|' wrangler.toml
          fi

          # 3) 注入 D1 库 ID（仓库文件供本地测试，不含线上库 ID）
          if grep -q '^database_id' wrangler.toml; then
            sed -i "s|^database_id *=.*|database_id = \"${D1_ID}\"|" wrangler.toml
          else
            sed -i "/^database_name = \"server-monitor-db\"$/a database_id = \"${D1_ID}\"" wrangler.toml
          fi

          # 4) 注入面板登录口令（幂等；上游若自带 [vars] 就写进那一节，避免 TOML 重复表）
          if grep -q '^\[vars\]' wrangler.toml; then
            if grep -q '^API_SECRET' wrangler.toml; then
              sed -i "s|^API_SECRET *=.*|API_SECRET = \"${PANEL_SECRET}\"|" wrangler.toml
            else
              sed -i "/^\[vars\]/a API_SECRET = \"${PANEL_SECRET}\"" wrangler.toml
            fi
          else
            printf '\n[vars]\nAPI_SECRET = "%s"\n' "${PANEL_SECRET}" >> wrangler.toml
          fi

          # 5) 硬校验：任一项不成立就让本次部署失败，绝不带错配置上线
          grep -q '^name = "cf-server-monitor"$' wrangler.toml || { echo "❌ worker 名未对齐"; exit 1; }
          grep -q '^keep_vars *= *true' wrangler.toml || { echo "❌ keep_vars 缺失"; exit 1; }
          [ "$(grep -c '^database_id' wrangler.toml)" = "1" ] || { echo "❌ database_id 注入异常"; exit 1; }
          [ "$(grep -c '^API_SECRET' wrangler.toml)" = "1" ] || { echo "❌ API_SECRET 注入异常"; exit 1; }
          grep -q '^name = "METRICS_BROADCASTER"$' wrangler.toml || { echo "❌ Durable Object 绑定名被改坏"; exit 1; }

          echo "✅ wrangler.toml 已就绪"
          grep -n '^name =\|^main =\|^keep_vars\|^\[triggers\]\|^crons\|^\[vars\]\|^database_id\|^binding =' wrangler.toml

      # wrangler v4 的 `deploy` 会自动根据 wrangler.toml 中的 [[durable_objects.bindings]]
      # 声明创建 DO namespace（幂等：已存在则跳过），无需单独命令。
      - name: 🚀 Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          wranglerVersion: '4'
          command: deploy

      - name: ✅ Deployment Success
        if: success()
        run: |
          echo "============================================"
          echo "  🎉 部署成功！"
          echo "============================================"

      - name: ❌ Deployment Failed
        if: failure()
        run: |
          echo "============================================"
          echo "  💥 部署失败！请检查 Actions 日志"
          echo "============================================"
